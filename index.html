<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yocloud Security</title>

  <style>
    body {
      margin: 0;
      /* Using a slightly deeper navy for a more premium feel */
      background: #020617; 
      color: white;
      font-family: 'ui-monospace', 'Cascadia Code', 'Source Code Pro', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    h1 {
      font-size: clamp(32px, 8vw, 48px); /* Responsive sizing */
      margin-bottom: 10px;
      letter-spacing: -1px;
      /* Adding a soft cyan glow to make the brand "pop" */
      text-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
    }

    p {
      color: #64748b;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Terminal-style blinking cursor */
    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.2em;
      background: #22d3ee;
      margin-left: 5px;
      vertical-align: middle;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Yocloud Security</h1>
    <p>Initializing Labs<span class="cursor"></span></p>
  </div>

</body>
</html>
