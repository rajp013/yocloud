<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoCloud Security | Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff41; /* Classic Terminal Green */
            font-family: 'Courier New', Courier, monospace;
        }
        .glow {
            text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen m-0 overflow-hidden">

    <div class="absolute inset-0 z-0 opacity-10" 
         style="background-image: radial-gradient(#00ff41 1px, transparent 1px); background-size: 30px 30px;">
    </div>

    <main class="relative z-10 text-center px-4">
        <div class="mb-6 inline-block p-3 border-2 border-[#00ff41] rounded-lg">
            <h1 class="text-4xl md:text-6xl font-bold tracking-tighter glow uppercase">
                YoCloud Security
            </h1>
        </div>
        
        <p class="text-xl md:text-2xl mb-8 text-gray-400">
            [ <span class="text-white">STATUS:</span> INITIALIZING_LABS... ]
        </p>

        <div class="max-w-md mx-auto bg-zinc-900 border border-zinc-800 p-6 rounded-md shadow-2xl">
            <h2 class="text-lg font-semibold text-white mb-4">Vulnerability Research & Learning Hub</h2>
            <p class="text-sm text-gray-500 leading-relaxed">
                A dedicated space for cybersecurity posts, CTF walkthroughs, and defensive/offensive practice environments. 
            </p>
            
            <div class="mt-8 pt-6 border-t border-zinc-800">
                <div class="flex items-center justify-center space-x-2">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                    <span class="text-xs uppercase tracking-widest text-gray-400 font-bold">Deployment in Progress</span>
                </div>
            </div>
        </div>

        <footer class="mt-12 text-zinc-600 text-xs uppercase tracking-widest">
            &copy; 2026 yocloud.in // Secure your perimeter.
        </footer>
    </main>

</body>
</html>
